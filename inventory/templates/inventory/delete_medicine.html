<!DOCTYPE html>
<html>
<head>
    <title>Delete Medicine</title>
</head>

<body>

    <h1>Delete Medicine</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ medicine.name }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">Yes, Delete</button>

    </form>

    <br>

    <a href="{% url 'medicine_list' %}">
        Cancel
    </a>

</body>
</html>
